<!doctype html><html lang="en"><meta charset="utf-8"><title>ChoiceGuard cancellation demo</title>
<style>body{font:17px system-ui;background:#eef2f7;color:#17263c;max-width:620px;margin:90px auto;padding:24px}main{background:white;padding:36px;border-radius:20px}button{padding:15px;margin:12px 8px 0 0;border-radius:8px;cursor:pointer}#keep{background:#17263c;color:white}#cancel{background:white;color:#566579}p{line-height:1.6}</style>
<main><small>CHOICEGUARD · LOCAL DEMO</small><h1>Cancel your membership</h1><p>You are on the final cancellation step. Confirm cancellation ends your membership. Choose Keep my benefits to keep your membership active.</p><button id="keep">Keep my benefits</button><button id="cancel">Confirm cancellation</button><p id="result" role="status"></p></main>
<script>document.getElementById('keep').onclick=()=>document.getElementById('result').textContent='Membership kept active (demo only).';document.getElementById('cancel').onclick=()=>document.getElementById('result').textContent='Membership cancelled (demo only).';</script></html>
